services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "file:/app/data/dev.db"
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET in .env}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?set GEMINI_API_KEY in .env}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      SEED_MANAGER_NAME: ${SEED_MANAGER_NAME:-Admin}
      SEED_MANAGER_EMAIL: ${SEED_MANAGER_EMAIL:-admin@example.com}
      SEED_MANAGER_PASSWORD: ${SEED_MANAGER_PASSWORD:-change-me-now}
    volumes:
      - fiberflow_data:/app/data
      - fiberflow_uploads:/app/uploads
    restart: unless-stopped

volumes:
  fiberflow_data:
  fiberflow_uploads:
